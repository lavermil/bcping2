<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="color-scheme" content="dark">
        <title>Server Status</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
        <style>
            .grid {
                grid-template-columns: 20% 80%;
            }
            button[type=submit] { width: max-content; }
			input[type=text] { width: 100%; }
    
            :root {
                --pico-font-family-sans-serif: Inter, system-ui, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, Helvetica, Arial, "Helvetica Neue", sans-serif, var(--pico-font-family-emoji);
                --pico-font-size: 87.5%;
                /* Original: 100% */
                --pico-line-height: 1.25;
                /* Original: 1.5 */
                --pico-form-element-spacing-vertical: 0.5rem;
                /* Original: 1rem */
                --pico-form-element-spacing-horizontal: 1.0rem;
                /* Original: 1.25rem */
                --pico-border-radius: 0.375rem;
                /* Original: 0.25rem */
            }
    
            @media (min-width: 576px) {
                :root {
                    --pico-font-size: 87.5%;
                    /* Original: 106.25% */
                }
            }
    
            @media (min-width: 768px) {
                :root {
                    --pico-font-size: 87.5%;
                    /* Original: 112.5% */
                }
            }
    
            @media (min-width: 1024px) {
                :root {
                    --pico-font-size: 87.5%;
                    /* Original: 118.75% */
                }
            }
    
            @media (min-width: 1280px) {
                :root {
                    --pico-font-size: 87.5%;
                    /* Original: 125% */
                }
            }
    
            @media (min-width: 1536px) {
                :root {
                    --pico-font-size: 87.5%;
                    /* Original: 131.25% */
                }
            }
    
            h1,
            h2,
            h3,
            h4,
            h5,
            h6 {
                --pico-font-weight: 600;
                /* Original: 700 */
            }
    
            article {
                border: 1px solid var(--pico-muted-border-color);
                /* Original doesn't have a border */
                border-radius: calc(var(--pico-border-radius) * 2);
                /* Original: var(--pico-border-radius) */
            }
    
            article>footer {
                border-radius: calc(var(--pico-border-radius) * 2);
                /* Original: var(--pico-border-radius) */
            }
        </style>
    </head>
<body>
    <main class="container">
        <h1>Manage Hosts</h1>
        <h2>Add Host</h2>
        <form method="POST">
            <input type="hidden" name="action" value="add">
            <label>Name: <input type="text" name="name" required></label>
            <label>IP: <input type="text" name="ip" required></label>
            <label>Address: <input type="text" name="address"></label>
            <label>Phone: <input type="text" name="phone"></label>
            <button type="submit">Add Host</button>
        </form>

        <h2>Current Hosts</h2>
        <a href="{{ url_for('index') }}">Back to Status Page</a>
        <table class="striped">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>IP</th>
                    <th>Address</th>
                    <th>Phone</th>
                    <th>Actions</th>
                </tr>
            </thead>
            {% for host in hosts %}
            <tr>
                <form method="POST">
                    <input type="hidden" name="action" value="update">
                    <input type="hidden" name="original_ip" value="{{ host.ip }}">
                    <td>
                        <input type="text" name="name" value="{{ host.name }}" required>
                    </td>
                    <td>
                        <input type="text" name="ip" value="{{ host.ip }}" required>
                    </td>
                    <td>
                        <input type="text" name="address" value="{{ host.address }}">
                    </td>
                    <td>
                        <input type="text" name="phone" value="{{ host.phone }}">
                    </td>
                    <td>
                        <button type="submit">Update</button>
                </form>
                <form method="POST" style="display:inline;">
                    <input type="hidden" name="action" value="delete">
                    <input type="hidden" name="ip" value="{{ host.ip }}">
                    <button type="submit">Delete</button>
                </form>
                <form method="POST" style="display:inline;">
                    <input type="hidden" name="action" value="reset">
                    <input type="hidden" name="reset_ip" value="{{ host.ip }}">
                    <input type="hidden" name="reset_name" value="{{ host.name }}">
                    <input type="hidden" name="reset_phone" value="{{ host.phone }}">
                    <input type="hidden" name="reset_address" value="{{ host.address }}">
                    <button type="submit">Reset</button>
                </form>
                    </td>
            </tr>
            {% endfor %}
        </table>

        <br>
        <a href="{{ url_for('index') }}">Back to Status Page</a>
    </main>
</body>
</html>
